<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>คลังสินค้า RC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B6F7A'/%3E%3Cpath d='M8 12l8-4 8 4v9l-8 4-8-4z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M8 12l8 4 8-4M16 16v9' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
  /* Layout: single narrow column for a phone on the shelf. Sticky header = tabs + the two
     movement buttons (รับเข้า / จ่ายออก). Stock tab = big balance per product; History tab =
     append-only ledger with running balance. Balance = sum of movements, never typed in. */
  :root{
    color-scheme:light;
    --bg:#EBF0F1; --surface:#FFFFFF; --surface-2:#F4F7F7; --ink:#12212A; --muted:#536670;
    --faint:#879AA2; --line:#D3DCDF;
    --accent:#0B6F7A; --accent-ink:#FFFFFF; --accent-soft:#D5ECEE;
    --ok:#1E7A4A; --ok-soft:#D8EFE1;
    --short:#B03434; --short-soft:#F7DADA;
    --in:#1E7A4A; --in-ink:#FFFFFF; --in-soft:#D8EFE1;
    --out:#4A4FB5; --out-ink:#FFFFFF; --out-soft:#E1E2F7;
    --other:#5A6B73; --other-soft:#E3E9EB;
    --shadow:0 1px 2px rgba(18,33,42,.06),0 8px 24px -14px rgba(18,33,42,.25);
    --font:'IBM Plex Sans Thai','Leelawadee UI','Noto Sans Thai',Tahoma,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      --bg:#0E181D; --surface:#15232A; --surface-2:#1A2C34; --ink:#E5EEF0; --muted:#9BAEB6;
      --faint:#6D828B; --line:#27393F;
      --accent:#4FC1CC; --accent-ink:#06232A; --accent-soft:#143A40;
      --ok:#6FCB93; --ok-soft:#15352A; --short:#F08C8C; --short-soft:#3C2124;
      --in:#6FCB93; --in-ink:#06241A; --in-soft:#15352A;
      --out:#A3A7F2; --out-ink:#14163A; --out-soft:#23254A;
      --other:#9BB0B8; --other-soft:#1F2F36;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
    }
  }

  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--surface); z-index:10}
  button,input,select{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
  [hidden]{display:none!important}

  .gutter{max-width:760px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}

  /* header */
  .top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
  .top .gutter{padding-block:12px; display:flex; flex-direction:column; gap:10px}
  .title-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
  h1{font-size:20px; line-height:1.2; margin:0; font-weight:700}
  .who{font-size:12.5px; color:var(--muted); text-align:right; display:flex; align-items:center; gap:6px; min-width:0}
  .who b{color:var(--accent); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:11em}
  .seg{display:flex; gap:4px; padding:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px}
  .seg button{flex:1; min-height:38px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; font-size:13.5px; white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
  .seg .n{font-family:var(--mono); font-size:12px; margin-left:4px; opacity:.85}
  .move-btns{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .mbtn{min-height:50px; border:0; border-radius:12px; font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px}
  .mbtn.in{background:var(--in); color:var(--in-ink)}
  .mbtn.out{background:var(--out); color:var(--out-ink)}
  .mbtn[disabled]{opacity:.4; cursor:not-allowed}
  .mbtn svg{width:20px; height:20px}

  .btn{min-height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; justify-content:center; gap:6px}
  .btn:hover{border-color:var(--faint)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn.in{background:var(--in); color:var(--in-ink); border-color:var(--in)}
  .btn.out{background:var(--out); color:var(--out-ink); border-color:var(--out)}
  .btn.danger{color:var(--short); border-color:var(--short)}
  .btn[disabled]{opacity:.4; cursor:not-allowed}
  .link{border:0; background:none; padding:4px 6px; color:var(--muted); text-decoration:underline; font-size:12.5px; min-height:0}
  .link:hover{color:var(--ink)}
  .link[disabled]{opacity:.4; cursor:not-allowed}

  main{padding-block:14px 8px; display:flex; flex-direction:column; gap:12px}
  .notice{padding:10px 14px; border-radius:10px; font-size:13.5px; background:var(--short-soft); color:var(--short)}
  .notice.info{background:var(--accent-soft); color:var(--accent)}

  /* tiles */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; text-align:left; display:flex; flex-direction:column; gap:2px; min-width:0}
  .tile .k{font-size:12.5px; color:var(--muted)}
  .tile .v{font-family:var(--mono); font-weight:600; font-size:26px; line-height:1.15; font-variant-numeric:tabular-nums}
  .tile .s{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .tile .io{display:flex; gap:12px; font-family:var(--mono); font-weight:600; font-size:19px; font-variant-numeric:tabular-nums; line-height:1.4}
  .tile .io .i{color:var(--in)} .tile .io .o{color:var(--out)}

  .controls{display:flex; flex-direction:column; gap:10px}
  .search{width:100%; min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
  .search::placeholder{color:var(--faint)}
  .chipx{display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 12px; border-radius:20px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600; align-self:flex-start}
  .chipx button{border:0; background:none; font-size:16px; line-height:1; padding:2px 6px; color:inherit}

  /* stock list */
  .list{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .item{padding:14px 14px 10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
  .item:first-child{border-top:0}
  .head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
  .name{font-weight:600; font-size:16px; line-height:1.3; overflow-wrap:anywhere}
  .sub{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px; font-size:12.5px; color:var(--muted)}
  .sku{font-family:var(--mono); font-size:12.5px}
  .bal{text-align:right; flex:none}
  .bal .num{display:block; font-family:var(--mono); font-weight:600; font-size:32px; line-height:1; font-variant-numeric:tabular-nums}
  .bal .u{font-size:12px; color:var(--muted)}
  .item[data-k="out"] .num,.item[data-k="neg"] .num{color:var(--short)}
  .item[data-k="none"] .num{color:var(--faint)}
  .lvl{position:relative; height:8px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line)}
  .lvl i{position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--ok); transition:width .25s ease}
  .item[data-k="out"] .lvl i,.item[data-k="neg"] .lvl i{background:var(--short)}
  .meta{display:flex; align-items:center; gap:6px 10px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
  .pill{padding:2px 10px; border-radius:20px; font-weight:600; font-size:12px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .pill.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
  .pill.out,.pill.neg{background:var(--short-soft); color:var(--short); border-color:transparent}
  .mono{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
  .acts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .acts button{min-height:42px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); font-weight:600; font-size:13.5px}
  .acts button[data-act="in"]{color:var(--in); border-color:var(--in-soft); background:var(--in-soft)}
  .acts button[data-act="out"]{color:var(--out); border-color:var(--out-soft); background:var(--out-soft)}
  .acts button[disabled]{opacity:.4; cursor:not-allowed}
  .more{display:flex; gap:4px; justify-content:flex-end}

  /* history */
  .day{padding:8px 14px; font-size:12px; font-weight:600; color:var(--muted); background:var(--surface-2); border-top:1px solid var(--line); letter-spacing:.02em}
  .day:first-child{border-top:0}
  .mv{display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; padding:12px 14px; border-top:1px solid var(--line); align-items:start}
  .day + .mv{border-top:0}
  .ic{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-weight:700; font-size:18px}
  .ic.in{background:var(--in-soft); color:var(--in)}
  .ic.out{background:var(--out-soft); color:var(--out)}
  .ic.adj{background:var(--other-soft); color:var(--other)}
  .mvt{font-weight:600; overflow-wrap:anywhere}
  .mvs{font-size:12.5px; color:var(--muted); overflow-wrap:anywhere}
  .mvq{font-family:var(--mono); font-weight:600; font-size:18px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .mvq.in{color:var(--in)} .mvq.out{color:var(--out)} .mvq.adj{color:var(--other)}
  .mvq small{display:block; font-family:var(--font); font-weight:400; font-size:11.5px; color:var(--muted)}

  .empty{padding:36px 20px; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:12px; align-items:center; background:var(--surface); border:1px dashed var(--line); border-radius:14px}
  .empty strong{color:var(--ink); font-size:16px}
  .rowbtns{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center}
  .foot{padding-block:6px 56px; font-size:12px; color:var(--faint); text-align:center}

  /* sheets + login */
  .scrim{position:fixed; inset:0; background:rgba(8,16,20,.55); z-index:20; display:flex; align-items:flex-end; justify-content:center}
  .scrim.solid{background:var(--bg); align-items:center; z-index:40}
  .sheet{width:100%; max-width:520px; background:var(--surface); border-radius:18px 18px 0 0; padding:20px 18px; padding-bottom:max(20px,env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px; max-height:92vh; overflow-y:auto}
  .scrim.solid .sheet{border-radius:18px; border:1px solid var(--line); box-shadow:var(--shadow); margin:0 16px}
  @media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px}}
  .sheet h2{margin:0; font-size:18px}
  .sheet p{margin:0; font-size:13.5px; color:var(--muted)}
  .field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); font-weight:500; min-width:0}
  .field input,.field select{min-height:46px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--ink); font-size:15px; width:100%}
  .select-wrap{position:relative; display:block}
  .select-wrap select{appearance:none; -webkit-appearance:none; padding-right:36px; font-weight:500}
  .select-wrap::after{content:""; position:absolute; right:14px; top:50%; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-70%) rotate(45deg); pointer-events:none}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .typeseg{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .typeseg button{min-height:46px; border-radius:12px; border:2px solid var(--line); background:var(--surface-2); font-weight:700; color:var(--muted)}
  .typeseg button[aria-pressed="true"][data-t="in"]{border-color:var(--in); background:var(--in-soft); color:var(--in)}
  .typeseg button[aria-pressed="true"][data-t="out"]{border-color:var(--out); background:var(--out-soft); color:var(--out)}
  .qtyrow{display:flex; gap:8px}
  .qtyrow button{width:56px; min-height:56px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); font-size:26px; font-weight:600; line-height:1}
  .qtyrow input{flex:1; min-height:56px; text-align:center; font-family:var(--mono); font-size:28px; font-weight:600; border-radius:12px; font-variant-numeric:tabular-nums}
  .qtyrow input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
  .preview{padding:10px 14px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); font-size:14px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-variant-numeric:tabular-nums}
  .preview b{font-family:var(--mono)}
  .preview.err{background:var(--short-soft); border-color:transparent; color:var(--short)}
  .actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:2px}
  .actions .spacer{margin-right:auto}
  .errline{font-size:13px; color:var(--short); min-height:1.2em}
  .toast{position:fixed; left:50%; transform:translateX(-50%); z-index:60; bottom:max(18px,env(safe-area-inset-bottom,0px)); max-width:min(92vw,460px); background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:13.5px; box-shadow:var(--shadow)}
</style>
</head>
<body>

<header class="top">
  <div class="gutter">
    <div class="title-row">
      <h1>คลังสินค้า RC</h1>
      <div class="who" id="whoBox" hidden><b id="whoName"></b><button class="link" id="logout" type="button">ออก</button></div>
    </div>
    <div class="seg" id="tabs" role="group" aria-label="มุมมอง">
      <button type="button" data-tab="stock" aria-pressed="true">คงเหลือ</button>
      <button type="button" data-tab="hist" aria-pressed="false">ประวัติ<span class="n" id="nMoves">0</span></button>
    </div>
    <div class="move-btns">
      <button class="mbtn in" id="btnIn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>รับเข้า</button>
      <button class="mbtn out" id="btnOut" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V5M6 10l6-6 6 6M5 20h14"/></svg>จ่ายออก</button>
    </div>
  </div>
</header>

<main class="gutter">
  <div id="notices"></div>

  <section id="tabStock" style="display:flex;flex-direction:column;gap:12px">
    <div class="tiles" id="tiles"></div>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="ค้นหาชื่อสินค้าหรือ SKU" autocomplete="off">
      <div class="seg" id="seg" role="group" aria-label="กรองรายการ">
        <button type="button" data-f="all" aria-pressed="true">ทั้งหมด<span class="n" id="nAll">0</span></button>
        <button type="button" data-f="none" aria-pressed="false">ยังไม่ตั้งยอด<span class="n" id="nNone">0</span></button>
      </div>
    </div>
    <ul class="list" id="list" aria-label="คงเหลือรายสินค้า"></ul>
    <div class="empty" id="emptyStock" hidden></div>
    <div class="rowbtns">
      <button class="btn" id="addProduct" type="button">＋ เพิ่มสินค้า</button>
      <button class="btn" id="expStock" type="button">ส่งออกคงเหลือ CSV</button>
    </div>
  </section>

  <section id="tabHist" style="display:none;flex-direction:column;gap:12px">
    <div class="controls">
      <input class="search" id="hSearch" type="search" placeholder="ค้นหาสินค้า ครีเอเตอร์ หรือหมายเหตุ" autocomplete="off">
      <div class="seg" id="hSeg" role="group" aria-label="กรองประเภท">
        <button type="button" data-t="all" aria-pressed="true">ทั้งหมด</button>
        <button type="button" data-t="in" aria-pressed="false">รับเข้า</button>
        <button type="button" data-t="out" aria-pressed="false">จ่ายออก</button>
        <button type="button" data-t="adj" aria-pressed="false">ปรับยอด</button>
      </div>
      <div id="hProdChip"></div>
    </div>
    <ul class="list" id="hList" aria-label="ประวัติรับเข้า จ่ายออก"></ul>
    <div class="empty" id="emptyHist" hidden></div>
    <div class="rowbtns">
      <button class="btn" id="moreBtn" type="button" hidden>แสดงเพิ่ม</button>
      <button class="btn" id="expHist" type="button">ส่งออกประวัติ CSV</button>
    </div>
  </section>

  <div class="foot">ยอดคงเหลือ = รับเข้า − จ่ายออก ± ปรับยอดจากการนับ · ไม่ต้องพิมพ์ยอดเอง</div>
</main>

<div class="scrim solid" id="login" hidden>
  <form class="sheet" id="loginForm" autocomplete="on">
    <h2>เข้าสู่ระบบคลังสินค้า RC</h2>
    <p>ใช้บัญชีทีมที่แอดมินเชิญไว้ ถ้ายังไม่มีบัญชีให้ขอจากแอดมิน</p>
    <label class="field">อีเมล<input id="lEmail" type="email" autocomplete="username" required></label>
    <label class="field">รหัสผ่าน<input id="lPass" type="password" autocomplete="current-password" required></label>
    <div class="errline" id="lErr" role="alert"></div>
    <div class="actions"><button type="submit" class="btn primary" id="lGo">เข้าสู่ระบบ</button></div>
  </form>
</div>
<div class="scrim" id="scrim" hidden><form class="sheet" id="sheet" autocomplete="off"></form></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
  var CFG = {url:'https://vjdxdguafljerfmvrnff.supabase.co', key:'sb_publishable_cSGKyg8ntbH3ie5MnVHxkg_az8r7GTi'};
  var SKEY = 'rcs_session_v1';
  var $ = function(s){return document.querySelector(s)};
  var S = {products:[], moves:[], asc:[], bal:{}, has:{}, mon:{}, tab:'stock', filter:'all', q:'',
           hType:'all', hProd:null, hq:'', hLimit:100, uid:null, myName:'', role:null, loaded:false, ready:false, sig:''};
  var REASONS = {
    in:['รับจากแบรนด์ / ซัพพลายเออร์','คืนจากครีเอเตอร์','ยอดยกมา','อื่นๆ'],
    out:['ส่งให้ครีเอเตอร์','ขาย / ส่งออเดอร์','ตัวอย่าง / ของแถม','ชำรุด / สูญหาย','อื่นๆ']
  };
  var TYPE_LABEL = {in:'รับเข้า', out:'จ่ายออก', adj:'ปรับยอด (นับจริง)'};
  var STAT_TXT = {none:'ยังไม่ตั้งยอด', ok:'มีของ', out:'หมด', neg:'ติดลบ'};

  /* ---------- helpers ---------- */
  function h(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
  function num(n){return Number(n||0).toLocaleString('th-TH');}
  function toast(msg){var t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true},3800);}
  function pad(n){return String(n).padStart(2,'0');}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function nameOfMove(m){ if(m.by && m.by===S.uid) return 'คุณ'; return m.byName || 'เพื่อนร่วมทีม'; }
  function timeOf(iso){var d=new Date(iso); return isNaN(d)?'':d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});}
  function dayLabel(iso){
    var d=new Date(iso); if(isNaN(d)) return '';
    var t=new Date(), y=new Date(); y.setDate(t.getDate()-1);
    if(d.toDateString()===t.toDateString()) return 'วันนี้';
    if(d.toDateString()===y.toDateString()) return 'เมื่อวาน';
    return d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
  }
  function prod(id){return S.products.find(function(p){return p.id===id})||null;}
  function balOf(id){return S.bal[id]||0;}
  function stat(p){
    if(!S.has[p.id]) return 'none';
    var n=balOf(p.id); if(n<0) return 'neg'; if(n===0) return 'out'; return 'ok';
  }
  function canWrite(){return S.role==='editor'||S.role==='manager'||S.role==='admin';}
  function canDelProduct(){return S.role==='manager'||S.role==='admin';}
  function canDelMove(m){return S.role==='manager'||S.role==='admin'||(S.role==='editor'&&m.by&&m.by===S.uid);}

  /* ---------- Supabase (REST + Auth, no library) ---------- */
  var sess = null;
  function loadSess(){ try{return JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){return null;} }
  function saveSess(s){ sess=s; try{ if(s) localStorage.setItem(SKEY,JSON.stringify(s)); else localStorage.removeItem(SKEY);}catch(e){} }
  function authBody(j){ return {access:j.access_token, refresh:j.refresh_token, exp:Date.now()+Math.max(60,(j.expires_in||3600)-60)*1000, uid:j.user&&j.user.id, email:j.user&&j.user.email}; }
  function signIn(email, pw){
    return fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})})
      .then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(/invalid login/i.test(j.error_description||j.msg||'')?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':(j.error_description||j.msg||'เข้าสู่ระบบไม่สำเร็จ')); return j; });})
      .then(function(j){ saveSess(authBody(j)); });
  }
  function refreshTok(){
    if(!sess||!sess.refresh) return Promise.reject(new Error('nosess'));
    return fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh})})
      .then(function(r){return r.json().then(function(j){
        if(!r.ok){ if(r.status===400||r.status===401||r.status===403) saveSess(null); throw new Error('session หมดอายุ'); }
        saveSess(authBody(j));
      });});
  }
  function token(){ if(!sess) return Promise.reject(new Error('nosess')); if(Date.now()>sess.exp) return refreshTok().then(function(){return sess.access}); return Promise.resolve(sess.access); }
  function rest(path, opt){
    opt=opt||{};
    function go(retry){
      return token().then(function(t){
        var hd={apikey:CFG.key, Authorization:'Bearer '+t}; if(opt.body) hd['Content-Type']='application/json'; if(opt.prefer) hd.Prefer=opt.prefer;
        return fetch(CFG.url+'/rest/v1/'+path,{method:opt.method||'GET',headers:hd,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
      }).then(function(r){
        if(r.status===401 && retry){ return refreshTok().then(function(){return go(false)}); }
        return r.text().then(function(tx){
          var j=null; try{j=tx?JSON.parse(tx):null;}catch(e){}
          if(!r.ok){ var er=new Error((j&&j.message)||r.statusText); er.status=r.status; er.code=j&&j.code; throw er; }
          return j;
        });
      });
    }
    return go(true);
  }
  function fetchAll(path){ // PostgREST caps a response at 1,000 rows silently, so page through
    var out=[]; function page(off){
      return rest(path+'&limit=1000&offset='+off).then(function(rows){ rows=rows||[]; out=out.concat(rows); return rows.length<1000?out:page(off+1000); });
    }
    return page(0);
  }

  /* ---------- data ---------- */
  function compute(){
    var bal={}, has={}, mon={}, now=new Date(), ms=new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
    var asc=S.moves.slice().sort(function(a,b){return a.at<b.at?-1:a.at>b.at?1:(a.id<b.id?-1:1)});
    asc.forEach(function(m){
      var p=m.product; bal[p]=(bal[p]||0)+(m.delta||0); m.after=bal[p]; has[p]=true;
      if(m.at>=ms){ var o=mon[p]||(mon[p]={in:0,out:0}); if(m.type==='in') o.in+=m.qty; else if(m.type==='out') o.out+=m.qty; }
    });
    S.bal=bal; S.has=has; S.mon=mon; S.asc=asc;
  }
  function loadAll(force){
    return Promise.all([fetchAll('stock_products?select=*&order=name.asc'), fetchAll('stock_moves?select=*&order=at.asc,created_at.asc')]).then(function(r){
      var ps=r[0].map(function(p){return {id:p.id,name:p.name,sku:p.sku||'',unit:p.unit||'ชิ้น'}})
        .sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''),'th') || String(a.sku||'').localeCompare(String(b.sku||''),'th',{numeric:true})});
      var ms=r[1].map(function(m){return {id:m.id,product:m.product_id,type:m.type,qty:m.qty,delta:m.delta,reason:m.reason||'',ref:m.ref||'',at:new Date(m.at).toISOString(),by:m.by,byName:m.by_name||''}});
      var sig=ps.map(function(p){return p.id+p.name+p.sku+p.unit}).join('|')+'#'+ms.map(function(m){return m.id}).join('|');
      S.loaded=true;
      if(!force && sig===S.sig) return;
      S.sig=sig; S.products=ps; S.moves=ms; compute(); renderAll();
    });
  }
  function addMove(m){
    var body={product_id:m.product,type:m.type,qty:m.qty,delta:m.delta,reason:m.reason||'',ref:m.ref||'',at:m.at,by_name:S.myName||''};
    return rest('stock_moves',{method:'POST',body:body,prefer:'return=minimal'}).then(function(){return loadAll(true)}).catch(function(e){
      if(e&&(e.status===401||e.status===403)){ toast('บัญชีนี้บันทึกรายการไม่ได้ (สิทธิ์ไม่พอ)'); }
      else toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
      throw e;
    });
  }
  function saveProduct(id,data){
    return rest('stock_products?on_conflict=id',{method:'POST',body:{id:id,name:data.name,sku:data.sku,unit:data.unit},prefer:'resolution=merge-duplicates,return=minimal'}).then(function(){return loadAll(true)});
  }
  function deleteProduct(id){ return rest('stock_products?id=eq.'+encodeURIComponent(id),{method:'DELETE',prefer:'return=minimal'}).then(function(){return loadAll(true)}); }
  function deleteMove(id){ return rest('stock_moves?id=eq.'+encodeURIComponent(id),{method:'DELETE',prefer:'return=minimal'}).then(function(){return loadAll(true)}); }

  /* ---------- render ---------- */
  function passesStock(p){
    var k=stat(p);
    if(S.filter==='none' && k!=='none') return false;
    if(S.q){ var t=((p.name||'')+' '+(p.sku||'')).toLowerCase(); if(t.indexOf(S.q.toLowerCase())<0) return false; }
    return true;
  }
  function renderTiles(){
    var P=S.products.length, total=0, mi=0, mo=0;
    S.products.forEach(function(p){
      total+=Math.max(0,balOf(p.id));
      var m=S.mon[p.id]; if(m){mi+=m.in; mo+=m.out;}
    });
    var box=$('#tiles'); box.innerHTML='';
    var t1=h('div','tile'); t1.appendChild(h('span','k','คงเหลือรวม (ทุกหน่วย)')); t1.appendChild(h('span','v',num(total))); t1.appendChild(h('span','s',P+' รายการสินค้า')); box.appendChild(t1);
    var t3=h('div','tile'); t3.appendChild(h('span','k','เดือนนี้'));
    var io=h('span','io'); io.appendChild(h('span','i','+'+num(mi))); io.appendChild(h('span','o','−'+num(mo))); t3.appendChild(io);
    t3.appendChild(h('span','s','รับเข้า / จ่ายออก')); box.appendChild(t3);
    var t4=h('div','tile'); t4.appendChild(h('span','k','รายการเคลื่อนไหว')); t4.appendChild(h('span','v',num(S.moves.length)));
    t4.appendChild(h('span','s','ทั้งหมดที่บันทึกไว้')); box.appendChild(t4);
  }
  function renderStock(){
    var list=$('#list'); list.innerHTML='';
    var shown=0, maxBal=1;
    S.products.forEach(function(p){ if(balOf(p.id)>maxBal) maxBal=balOf(p.id); });
    var nNone=0; S.products.forEach(function(p){ if(stat(p)==='none') nNone++; });
    $('#nAll').textContent=S.products.length; $('#nNone').textContent=nNone;
    var wr=canWrite();
    S.products.forEach(function(p){
      if(!passesStock(p)) return; shown++;
      var k=stat(p), n=balOf(p.id), m=S.mon[p.id]||{in:0,out:0};
      var li=h('li','item'); li.dataset.id=p.id; li.dataset.k=k;
      var head=h('div','head'), info=h('div','info');
      info.appendChild(h('div','name',p.name||'(ไม่มีชื่อ)'));
      if(p.sku){ var sub=h('div','sub'); sub.appendChild(h('span','sku',p.sku)); info.appendChild(sub); }
      head.appendChild(info);
      var bal=h('div','bal'); bal.appendChild(h('b','num',num(n))); bal.appendChild(h('span','u',p.unit||'ชิ้น')); head.appendChild(bal);
      li.appendChild(head);
      var lvl=h('div','lvl'), fill=h('i'); fill.style.width=Math.max(0,Math.min(100,maxBal>0?n/maxBal*100:0))+'%'; lvl.appendChild(fill);
      li.appendChild(lvl);
      var meta=h('div','meta'); meta.appendChild(h('span','pill '+(k==='none'?'':k),STAT_TXT[k]));
      if(k==='none') meta.appendChild(h('span','','กดรับเข้าเพื่อตั้งยอดตั้งต้น'));
      else meta.appendChild(h('span','mono','เดือนนี้ +'+num(m.in)+' / −'+num(m.out)));
      li.appendChild(meta);
      var acts=h('div','acts');
      [['in','รับเข้า'],['out','จ่ายออก'],['count','นับจริง']].forEach(function(a){
        var bt=h('button',null,a[1]); bt.type='button'; bt.dataset.act=a[0]; bt.disabled=!wr; acts.appendChild(bt);
      });
      li.appendChild(acts);
      var more=h('div','more');
      var l1=h('button','link','ดูประวัติ'); l1.type='button'; l1.dataset.act='hist'; more.appendChild(l1);
      var l2=h('button','link','แก้ไข'); l2.type='button'; l2.dataset.act='edit'; l2.disabled=!wr; more.appendChild(l2);
      li.appendChild(more); list.appendChild(li);
    });
    var e=$('#emptyStock'); e.innerHTML='';
    list.hidden = shown===0;
    if(!S.ready || !S.loaded){ e.hidden=false; e.appendChild(h('strong',null,'กำลังโหลดรายการสินค้า…')); }
    else if(!S.products.length){
      e.hidden=false; e.appendChild(h('strong',null,'ยังไม่มีสินค้าในคลัง'));
      e.appendChild(h('span',null,'เพิ่มสินค้า แล้วกด "รับเข้า" เพื่อตั้งยอดตั้งต้น'));
      if(wr){ var bb=h('button','btn primary','＋ เพิ่มสินค้าชิ้นแรก'); bb.type='button'; bb.onclick=function(){openProduct()}; e.appendChild(bb); }
    } else if(shown===0){
      e.hidden=false; e.appendChild(h('strong',null,'ไม่พบรายการที่ตรงกับตัวกรอง')); e.appendChild(h('span',null,'ลองเปลี่ยนตัวกรองหรือล้างช่องค้นหา'));
    } else e.hidden=true;
  }
  function histRows(){
    var q=S.hq.toLowerCase();
    return S.asc.slice().reverse().filter(function(m){
      if(S.hType!=='all' && m.type!==S.hType) return false;
      if(S.hProd && m.product!==S.hProd) return false;
      if(q){ var p=prod(m.product); var t=((p?p.name+' '+(p.sku||''):'')+' '+(m.ref||'')+' '+(m.reason||'')).toLowerCase(); if(t.indexOf(q)<0) return false; }
      return true;
    });
  }
  function renderHist(){
    var rows=histRows(), list=$('#hList'); list.innerHTML='';
    $('#nMoves').textContent=S.moves.length;
    var chip=$('#hProdChip'); chip.innerHTML='';
    if(S.hProd){
      var p0=prod(S.hProd); var c=h('span','chipx'); c.appendChild(h('span',null,'เฉพาะ '+(p0?p0.name+(p0.sku?' '+p0.sku:''):'สินค้า')));
      var x=h('button',null,'×'); x.type='button'; x.setAttribute('aria-label','ล้างตัวกรองสินค้า'); x.onclick=function(){S.hProd=null; renderHist();}; c.appendChild(x); chip.appendChild(c);
    }
    var last='', cnt=0;
    rows.slice(0,S.hLimit).forEach(function(m){
      var d=dayLabel(m.at); if(d!==last){ list.appendChild(h('li','day',d)); last=d; }
      var p=prod(m.product), li=h('li','mv'); li.dataset.id=m.id;
      li.appendChild(h('div','ic '+m.type, m.type==='in'?'↓':m.type==='out'?'↑':'⇄'));
      var mid=h('div'); mid.appendChild(h('div','mvt',p?(p.name+(p.sku?' · '+p.sku:'')):'(สินค้าถูกลบ)'));
      var line=(m.type==='adj'?'ปรับยอดจากการนับ':(m.reason||TYPE_LABEL[m.type]))+(m.ref?' · '+m.ref:'');
      mid.appendChild(h('div','mvs',line));
      mid.appendChild(h('div','mvs',nameOfMove(m)+' · '+timeOf(m.at)));
      if(canDelMove(m)){ var del=h('button','link','ลบรายการ'); del.type='button'; del.dataset.act='del'; mid.appendChild(del); }
      li.appendChild(mid);
      var q=h('div','mvq '+m.type); var sign=(m.delta||0)>0?'+':((m.delta||0)<0?'−':'');
      q.appendChild(document.createTextNode(sign+num(Math.abs(m.delta||0)))); q.appendChild(h('small',null,'คงเหลือ '+num(m.after)));
      li.appendChild(q); list.appendChild(li); cnt++;
    });
    var e=$('#emptyHist'); e.innerHTML='';
    list.hidden=!cnt;
    if(S.ready && S.loaded && !cnt){
      e.hidden=false;
      if(!S.moves.length){
        e.appendChild(h('strong',null,'ยังไม่มีรายการรับเข้าหรือจ่ายออก'));
        e.appendChild(h('span',null,'ทุกครั้งที่กดรับเข้า จ่ายออก หรือนับจริง จะมาอยู่ที่นี่พร้อมชื่อคนบันทึก'));
      } else e.appendChild(h('strong',null,'ไม่พบรายการที่ตรงกับตัวกรอง'));
    } else e.hidden=true;
    var more=$('#moreBtn'); more.hidden = rows.length<=S.hLimit;
    more.textContent='แสดงเพิ่ม (เหลือ '+num(Math.max(0,rows.length-S.hLimit))+')';
  }
  function renderNotices(){
    var box=$('#notices'); box.innerHTML='';
    if(S.ready && S.role===null) box.appendChild(h('div','notice','บัญชีนี้ยังไม่มีสิทธิ์ใช้งานคลังสินค้า หรือถูกระงับอยู่ ติดต่อแอดมิน'));
    else if(S.ready && S.role==='viewer') box.appendChild(h('div','notice info','บัญชีนี้ดูได้อย่างเดียว ขอสิทธิ์ editor จากแอดมินถ้าต้องบันทึกรายการ'));
  }
  function renderAll(){
    var wr=canWrite();
    $('#btnIn').disabled=$('#btnOut').disabled=!wr || !S.ready;
    $('#addProduct').disabled=!wr || !S.ready;
    $('#tabStock').style.display = S.tab==='stock'?'flex':'none';
    $('#tabHist').style.display = S.tab==='hist'?'flex':'none';
    [].forEach.call($('#tabs').querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.tab===S.tab))});
    renderNotices(); renderTiles(); renderStock(); renderHist();
  }

  /* ---------- sheets ---------- */
  function openSheet(html, bind){
    var f=$('#sheet'); f.innerHTML=html; $('#scrim').hidden=false; f.onsubmit=function(e){e.preventDefault()}; bind(f);
  }
  function closeSheet(){ $('#scrim').hidden=true; $('#sheet').innerHTML=''; }
  function fillSelect(sel, items, val){
    sel.innerHTML=''; items.forEach(function(it){var o=h('option',null,it.label); o.value=it.value; sel.appendChild(o);}); if(val!=null) sel.value=val;
  }
  function parseQty(v){var n=parseInt(String(v).replace(/[^0-9]/g,''),10); return isNaN(n)?0:n;}

  function openMove(type, pid){
    if(!S.products.length){toast('เพิ่มสินค้าก่อนบันทึกรายการ'); return;}
    var cur=type||'in', busy=false;
    openSheet(
      '<h2 id="mTitle"></h2>'+
      '<div class="typeseg" role="group" aria-label="ประเภท"><button type="button" data-t="in">↓ รับเข้า</button><button type="button" data-t="out">↑ จ่ายออก</button></div>'+
      '<label class="field">สินค้า<span class="select-wrap"><select id="mProd"></select></span></label>'+
      '<div class="field">จำนวน<div class="qtyrow"><button type="button" id="mDec" aria-label="ลด">−</button><input id="mQty" inputmode="numeric" pattern="[0-9]*" placeholder="0" aria-label="จำนวน"><button type="button" id="mInc" aria-label="เพิ่ม">+</button></div></div>'+
      '<div class="preview" id="mPrev"></div>'+
      '<div class="two"><label class="field">เหตุผล<span class="select-wrap"><select id="mReason"></select></span></label><label class="field">วันที่<input id="mDate" type="date"></label></div>'+
      '<label class="field"><span id="mRefLbl">อ้างอิง / หมายเหตุ</span><input id="mRef" maxlength="80"></label>'+
      '<div class="actions"><button type="button" class="btn" id="mCancel">ยกเลิก</button><button type="button" class="btn" id="mMore">บันทึกและเพิ่มต่อ</button><button type="button" class="btn primary" id="mSave">บันทึก</button></div>',
      function(f){
        var selP=f.querySelector('#mProd'), selR=f.querySelector('#mReason'), qty=f.querySelector('#mQty'), prev=f.querySelector('#mPrev');
        fillSelect(selP, S.products.map(function(p){return {value:p.id,label:p.name+(p.sku?' ('+p.sku+')':'')}}), pid||S.products[0].id);
        f.querySelector('#mDate').value=ymd(new Date());
        function reasons(){ fillSelect(selR, REASONS[cur].map(function(r){return {value:r,label:r}})); }
        function refresh(){
          [].forEach.call(f.querySelectorAll('.typeseg button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.t===cur))});
          f.querySelector('#mTitle').textContent = cur==='in'?'บันทึกรับเข้า':'บันทึกจ่ายออก';
          var save=f.querySelector('#mSave'); save.className='btn '+(cur==='in'?'in':'out'); save.textContent=cur==='in'?'บันทึกรับเข้า':'บันทึกจ่ายออก';
          f.querySelector('#mRefLbl').textContent = (cur==='out' && selR.value==='ส่งให้ครีเอเตอร์') ? 'ครีเอเตอร์ (เช่น @valentine) / แคมเปญ' : 'เลขที่เอกสาร / หมายเหตุ';
          var p=prod(selP.value), n=balOf(selP.value), q=parseQty(qty.value), after=cur==='in'?n+q:n-q, u=p&&p.unit||'ชิ้น';
          prev.className='preview'; prev.innerHTML='';
          if(cur==='out' && q>n){
            prev.className='preview err'; prev.appendChild(h('span',null,'คงเหลือไม่พอ (มี '+num(n)+' '+u+')'));
          } else {
            prev.appendChild(h('span',null,'คงเหลือตอนนี้ '+num(n)+' '+u));
            prev.appendChild(h('b',null,'→ '+num(after)+' '+u));
          }
          var ok=q>0 && !(cur==='out' && q>n); f.querySelector('#mSave').disabled=!ok; f.querySelector('#mMore').disabled=!ok;
        }
        reasons(); refresh();
        [].forEach.call(f.querySelectorAll('.typeseg button'),function(b){b.onclick=function(){cur=b.dataset.t; reasons(); refresh();}});
        selP.onchange=refresh; selR.onchange=refresh;
        qty.oninput=function(){qty.value=qty.value.replace(/[^0-9]/g,'').slice(0,6); refresh();};
        f.querySelector('#mInc').onclick=function(){qty.value=String(parseQty(qty.value)+1); refresh();};
        f.querySelector('#mDec').onclick=function(){qty.value=String(Math.max(0,parseQty(qty.value)-1)); refresh();};
        f.querySelector('#mCancel').onclick=closeSheet;
        function save(more){
          if(busy) return; var q=parseQty(qty.value), p=prod(selP.value); if(!p||q<=0) return;
          if(cur==='out' && q>balOf(p.id)) return;
          var ds=f.querySelector('#mDate').value, now=new Date(), at;
          if(!ds || ds===ymd(now)) at=now.toISOString(); else { var d=new Date(ds+'T12:00:00'); at=isNaN(d)?now.toISOString():d.toISOString(); }
          busy=true;
          addMove({product:p.id, type:cur, qty:q, delta:cur==='in'?q:-q, reason:selR.value, ref:f.querySelector('#mRef').value.trim(), at:at}).then(function(){
            toast((cur==='in'?'รับเข้า ':'จ่ายออก ')+num(q)+' '+(p.unit||'ชิ้น')+' · '+p.name);
            if(more){ qty.value=''; f.querySelector('#mRef').value=''; busy=false; refresh(); qty.focus(); } else closeSheet();
          }).catch(function(){busy=false;});
        }
        f.querySelector('#mSave').onclick=function(){save(false)};
        f.querySelector('#mMore').onclick=function(){save(true)};
        f.onsubmit=function(e){e.preventDefault(); if(!f.querySelector('#mSave').disabled) save(false);};
        setTimeout(function(){qty.focus()},30);
      });
  }

  function openCount(pid){
    var p=prod(pid); if(!p) return; var busy=false;
    openSheet(
      '<h2>นับจริง · <span id="cName"></span></h2>'+
      '<div class="preview"><span>ยอดในระบบ</span><b id="cSys"></b></div>'+
      '<div class="field">นับได้จริง<div class="qtyrow"><button type="button" id="cDec" aria-label="ลด">−</button><input id="cQty" inputmode="numeric" pattern="[0-9]*" placeholder="0" aria-label="นับได้จริง"><button type="button" id="cInc" aria-label="เพิ่ม">+</button></div></div>'+
      '<div class="preview" id="cPrev"></div>'+
      '<label class="field">หมายเหตุ (ไม่บังคับ)<input id="cRef" maxlength="80" placeholder="เช่น นับรอบสิ้นเดือน"></label>'+
      '<div class="actions"><button type="button" class="btn" id="cCancel">ยกเลิก</button><button type="button" class="btn primary" id="cSave">ปรับยอดตามที่นับ</button></div>',
      function(f){
        var qty=f.querySelector('#cQty'), prev=f.querySelector('#cPrev'), sys=balOf(pid), u=p.unit||'ชิ้น';
        f.querySelector('#cName').textContent=p.name+(p.sku?' '+p.sku:''); f.querySelector('#cSys').textContent=num(sys)+' '+u;
        function refresh(){
          var has=qty.value!==''; var q=parseQty(qty.value), d=q-sys;
          prev.className='preview'; prev.innerHTML='';
          if(!has){ prev.appendChild(h('span',null,'กรอกจำนวนที่นับได้จริง')); f.querySelector('#cSave').disabled=true; return; }
          if(d===0){ prev.appendChild(h('span',null,'ตรงกับระบบ ไม่ต้องปรับยอด')); f.querySelector('#cSave').disabled=true; return; }
          prev.appendChild(h('span',null,(d<0?'ขาด ':'เกิน ')+num(Math.abs(d))+' '+u)); prev.appendChild(h('b',null,'ปรับยอดเป็น '+num(q)));
          if(d<0) prev.className='preview err'; f.querySelector('#cSave').disabled=false;
        }
        refresh();
        qty.oninput=function(){qty.value=qty.value.replace(/[^0-9]/g,'').slice(0,6); refresh();};
        f.querySelector('#cInc').onclick=function(){qty.value=String((qty.value===''?sys:parseQty(qty.value))+1); refresh();};
        f.querySelector('#cDec').onclick=function(){qty.value=String(Math.max(0,(qty.value===''?sys:parseQty(qty.value))-1)); refresh();};
        f.querySelector('#cCancel').onclick=closeSheet;
        function save(){
          if(busy) return; var q=parseQty(qty.value), d=q-balOf(pid); if(qty.value===''||d===0) return; busy=true;
          addMove({product:pid, type:'adj', qty:Math.abs(d), delta:d, reason:'ปรับยอดจากการนับ', ref:f.querySelector('#cRef').value.trim(), at:new Date().toISOString()})
            .then(function(){toast('ปรับยอด '+p.name+' เป็น '+num(q)); closeSheet();}).catch(function(){busy=false;});
        }
        f.querySelector('#cSave').onclick=save; f.onsubmit=function(e){e.preventDefault(); if(!f.querySelector('#cSave').disabled) save();};
        setTimeout(function(){qty.focus()},30);
      });
  }

  function openProduct(p){
    var edit=!!p, busy=false;
    openSheet(
      '<h2>'+(edit?'แก้ไขสินค้า':'เพิ่มสินค้า')+'</h2>'+
      '<label class="field">ชื่อสินค้า<input id="pName" required maxlength="80"></label>'+
      '<div class="two"><label class="field">SKU / รหัสสี<input id="pSku" maxlength="40"></label><label class="field">หน่วย<input id="pUnit" maxlength="12" placeholder="ชิ้น"></label></div>'+
      (edit?'':'<label class="field">ยอดตั้งต้น (ถ้ามีของอยู่แล้ว)<input id="pOpen" inputmode="numeric" pattern="[0-9]*" placeholder="0"></label>')+
      '<div class="actions">'+(edit&&canDelProduct()?'<button type="button" class="btn danger spacer" id="pDel">ลบสินค้า</button>':'')+'<button type="button" class="btn" id="pCancel">ยกเลิก</button><button type="submit" class="btn primary">บันทึก</button></div>',
      function(f){
        if(edit){ f.querySelector('#pName').value=p.name||''; f.querySelector('#pSku').value=p.sku||''; f.querySelector('#pUnit').value=p.unit||''; }
        f.querySelector('#pCancel').onclick=closeSheet;
        var del=f.querySelector('#pDel');
        if(del) del.onclick=function(){
          if(del.dataset.arm!=='1'){del.dataset.arm='1'; del.textContent='ยืนยันลบสินค้า?'; return;}
          deleteProduct(p.id).then(function(){closeSheet(); toast('ลบสินค้าแล้ว')}).catch(function(e){
            toast(e&&e.code==='23503'?'ลบไม่ได้ เพราะสินค้านี้มีประวัติรับเข้า/จ่ายออกแล้ว':'ลบไม่สำเร็จ');
          });
        };
        f.onsubmit=function(e){
          e.preventDefault(); if(busy) return;
          var name=f.querySelector('#pName').value.trim(); if(!name) return;
          var data={name:name, sku:f.querySelector('#pSku').value.trim(), unit:f.querySelector('#pUnit').value.trim()||'ชิ้น'};
          var id=edit?p.id:'p'+Date.now().toString(36);
          busy=true;
          saveProduct(id,data).then(function(){
            var open=edit?0:parseQty((f.querySelector('#pOpen')||{}).value);
            if(open>0) return addMove({product:id,type:'in',qty:open,delta:open,reason:'ยอดยกมา',ref:'',at:new Date().toISOString()});
          }).then(function(){closeSheet(); toast(edit?'บันทึกแล้ว':'เพิ่มสินค้าแล้ว')}).catch(function(){busy=false; toast('บันทึกสินค้าไม่สำเร็จ ลองใหม่อีกครั้ง')});
        };
        setTimeout(function(){f.querySelector('#pName').focus()},30);
      });
  }

  /* ---------- export ---------- */
  function csvCell(v){v=(v===null||v===undefined)?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  function saveCsv(fname, lines){
    var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1500); toast('บันทึกไฟล์แล้ว');
  }
  function stamp(){var d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
  function exportStock(){
    var lines=[['SKU','ชื่อสินค้า','หน่วย','คงเหลือ','สถานะ','รับเข้าเดือนนี้','จ่ายออกเดือนนี้'].map(csvCell).join(',')];
    S.products.forEach(function(p){var m=S.mon[p.id]||{in:0,out:0};
      lines.push([p.sku,p.name,p.unit,balOf(p.id),STAT_TXT[stat(p)],m.in,m.out].map(csvCell).join(','));});
    saveCsv('rc-stock-balance-'+stamp()+'.csv', lines);
  }
  function exportHist(){
    var lines=[['วันที่','เวลา','SKU','สินค้า','ประเภท','จำนวน (+/−)','เหตุผล','อ้างอิง','ผู้บันทึก','คงเหลือหลังรายการ'].map(csvCell).join(',')];
    S.asc.forEach(function(m){var p=prod(m.product), d=new Date(m.at);
      lines.push([ymd(d),timeOf(m.at),p?p.sku:'',p?p.name:'(สินค้าถูกลบ)',TYPE_LABEL[m.type]||m.type,m.delta,m.reason,m.ref,nameOfMove(m),m.after].map(csvCell).join(','));});
    saveCsv('rc-stock-moves-'+stamp()+'.csv', lines);
  }

  /* ---------- events ---------- */
  $('#tabs').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; renderAll(); window.scrollTo({top:0});});
  $('#btnIn').onclick=function(){openMove('in')};
  $('#btnOut').onclick=function(){openMove('out')};
  $('#addProduct').onclick=function(){openProduct()};
  $('#expStock').onclick=exportStock; $('#expHist').onclick=exportHist;
  $('#seg').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b) return; S.filter=b.dataset.f;
    [].forEach.call($('#seg').querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x===b))}); renderStock();});
  $('#search').addEventListener('input',function(e){S.q=e.target.value.trim(); renderStock();});
  $('#hSearch').addEventListener('input',function(e){S.hq=e.target.value.trim(); S.hLimit=100; renderHist();});
  $('#hSeg').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b) return; S.hType=b.dataset.t; S.hLimit=100;
    [].forEach.call($('#hSeg').querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x===b))}); renderHist();});
  $('#moreBtn').onclick=function(){S.hLimit+=100; renderHist();};
  $('#list').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b||b.disabled) return; var li=b.closest('.item'); var pid=li.dataset.id, a=b.dataset.act;
    if(a==='in'||a==='out') openMove(a,pid); else if(a==='count') openCount(pid);
    else if(a==='edit') openProduct(prod(pid));
    else if(a==='hist'){S.hProd=pid; S.tab='hist'; S.hType='all'; S.hq=''; $('#hSearch').value=''; [].forEach.call($('#hSeg').querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x.dataset.t==='all'))}); renderAll(); window.scrollTo({top:0});}
  });
  $('#hList').addEventListener('click',function(e){
    var b=e.target.closest('[data-act="del"]'); if(!b||b.disabled) return; var id=b.closest('.mv').dataset.id;
    if(b.dataset.arm!=='1'){b.dataset.arm='1'; b.textContent='ยืนยันลบ? ยอดคงเหลือจะเปลี่ยน'; setTimeout(function(){ if(b.isConnected){b.dataset.arm='0'; b.textContent='ลบรายการ';} },4000); return;}
    deleteMove(id).then(function(){toast('ลบรายการแล้ว')}).catch(function(){toast('ลบไม่สำเร็จ')});
  });
  $('#scrim').addEventListener('mousedown',function(e){ if(e.target===$('#scrim')) closeSheet(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !$('#scrim').hidden) closeSheet(); });

  /* ---------- session / boot ---------- */
  function showLogin(msg){
    S.ready=false; $('#login').hidden=false; $('#whoBox').hidden=true; $('#lErr').textContent=msg||''; setTimeout(function(){$('#lEmail').focus()},30);
  }
  function enter(){
    S.uid=sess.uid; $('#login').hidden=true; $('#lPass').value='';
    return rest('rpc/stock_role',{method:'POST',body:{}}).then(function(r){ S.role=r||null; })
      .then(function(){ return rest('app_users?select=display_name&id=eq.'+encodeURIComponent(S.uid)).catch(function(){return []}); })
      .then(function(r){
        var dn=r&&r[0]&&r[0].display_name; S.myName=dn||(sess.email||'').split('@')[0];
        $('#whoName').textContent=S.myName; $('#whoBox').hidden=false; S.ready=true;
        renderAll();
        if(S.role===null){ S.loaded=true; return; }
        return loadAll(true);
      }).catch(function(e){
        if(sess){ toast('โหลดข้อมูลไม่สำเร็จ ('+(e&&e.message||'error')+')'); S.ready=true; S.loaded=true; renderAll(); }
        else showLogin('session หมดอายุ กรุณาเข้าสู่ระบบใหม่');
      });
  }
  $('#loginForm').addEventListener('submit',function(e){
    e.preventDefault(); var go=$('#lGo'); go.disabled=true; $('#lErr').textContent='';
    signIn($('#lEmail').value.trim(), $('#lPass').value).then(enter).catch(function(er){ $('#lErr').textContent=(er&&er.message)||'เข้าสู่ระบบไม่สำเร็จ'; }).then(function(){go.disabled=false;});
  });
  $('#logout').onclick=function(){
    saveSess(null); S.products=[]; S.moves=[]; S.sig=''; S.role=null; S.loaded=false; compute(); renderAll(); showLogin('');
  };
  setInterval(function(){ if(S.ready && S.role!==null && document.visibilityState==='visible' && sess){ loadAll(false).catch(function(){}); } }, 20000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && S.ready && S.role!==null && sess) loadAll(false).catch(function(){}); });

  renderAll();
  sess=loadSess();
  if(sess && sess.refresh){ enter(); } else showLogin('');
})();
</script>
</body>
</html>
